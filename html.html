<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Quiz - IntelliFolio</title>
    <style>
        .glow {
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.6);
        }
        .gradient-text {
            background: linear-gradient(90deg, #a855f7, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body class="bg-black text-white font-sans p-6">
    <div class="flex justify-end mb-6">
        <button onclick="goBack()" class="bg-purple-600 px-4 py-1 rounded hover:bg-purple-700 glow">
            ⬅ Select Quiz
        </button>
    </div>
    <h1 class="text-3xl text-center mb-10 gradient-text">
        🌐 HTML Quiz 
    </h1>
    <div id="quizBox" class="max-w-2xl mx-auto bg-white/10 p-6 rounded-xl glow">
        <h2 id="question" class="text-xl mb-6"></h2>
        <div id="options" class="space-y-3"></div>
        <button onclick="nextQuestion()"
            class="mt-6 w-full bg-purple-600 py-2 rounded hover:bg-purple-700 glow transition">
            Next
        </button>
    </div>
    <div id="resultBox" class="hidden text-center mt-10">
        <h2 class="text-2xl text-blue-400 mb-4">Your Score</h2>
        <p id="score" class="text-xl"></p>
        <button onclick="restartQuiz()" class="mt-6 bg-purple-600 px-6 py-2 rounded hover:bg-purple-700 glow">
            Restart Quiz
        </button>
    </div>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function goBack() {
            window.location.href = "quiz.html";
        }
        const quiz = [
            {
                question: "What does HTML stand for?",
                options: ["Hyper Trainer Marking Language", "Hyper Text Markup Language", "Hyper Text Marketing Language", "None"],
                answer: 1
            },
            {
                question: "Which language is used for styling?",
                options: ["HTML", "Python", "CSS", "Java"],
                answer: 2
            },
            {
                question: "JavaScript is used for?",
                options: ["Styling", "Structure", "Interactivity", "Database"],
                answer: 2
            },
            {
                question: "Which is a frontend framework?",
                options: ["React", "Node", "MongoDB", "Firebase"],
                answer: 0
            },
            {
                question: "Which database is NoSQL?",
                options: ["MySQL", "Oracle", "MongoDB", "PostgreSQL"],
                answer: 2
            }
        ];
        let current = 0;
        let score = 0;
        let selected = null;
        function loadQuestion() {
            let q = quiz[current];
            document.getElementById("question").innerText = q.question;
            let optionsHTML = "";
            q.options.forEach((opt, index) => {
                optionsHTML += `
                <div onclick="selectOption(${index}, this)"
                    class="p-3 bg-black/50 border border-gray-700 rounded cursor-pointer 
                    hover:bg-purple-600/30 transition duration-200">
                    ${opt}
                </div>
                `;
            });
            document.getElementById("options").innerHTML = optionsHTML;
            selected = null;
        }
        function selectOption(index, el) {
            selected = index;
            let all = document.querySelectorAll("#options div");
            all.forEach(e => {
                e.classList.remove("bg-purple-600", "border-purple-500", "scale-105");
            });
            el.classList.add("bg-purple-600", "border-purple-500", "scale-105");
        }
        function nextQuestion() {
            if (selected === null) {
                alert("Select an option first!");
                return;
            }
            if (selected === quiz[current].answer) {
                score++;
            }
            current++;
            if (current < quiz.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }
        function showResult() {
            document.getElementById("quizBox").classList.add("hidden");
            document.getElementById("resultBox").classList.remove("hidden");
            document.getElementById("score").innerText =
                `You scored ${score} out of ${quiz.length}`;
        }
        function restartQuiz() {
            current = 0;
            score = 0;
            document.getElementById("quizBox").classList.remove("hidden");
            document.getElementById("resultBox").classList.add("hidden");
            loadQuestion();
        }
        loadQuestion();
    </script>
</body>
</html>
